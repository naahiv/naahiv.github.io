name: Publish website

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install native diagram and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended texlive-science dvisvgm poppler-utils util-linux

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Check content and first-post publication
        run: |
          npm test
          npm run test:release

      - name: Build production and verify canonical assets
        env:
          INCLUDE_DRAFTS: 'false'
        run: |
          npm run build
          node scripts/verify-preservation.mjs

      - name: Build the separate draft preview for browser checks
        run: |
          rm -rf .cache/tikzcd .astro
          npm run build:preview
          node scripts/verify-preservation.mjs --dir=dist-preview

      - name: Install and test all supported browsers
        run: |
          npx --no-install playwright install --with-deps chromium firefox webkit
          npm run test:browser

      - name: Package only the production website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified production website
        id: deployment
        uses: actions/deploy-pages@v4
